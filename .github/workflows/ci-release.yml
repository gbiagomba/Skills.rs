# .github/workflows/ci-release.yml
#
# CI and release for `skill`.
#
# Gate, on every push and pull request: formatting, clippy with warnings denied
# across both feature configurations, the test suite with the lockfile pinned,
# and a release build, on Linux, macOS (Intel and ARM), and Windows. A separate
# job checks the declared MSRV, and another checks that the crate builds with
# --no-default-features so the SMB feature stays genuinely optional.
#
# Build artifacts are uploaded on every successful build, not only on a tag, so a
# reviewer can download a binary from a pull request.
#
# Releases are created only for a `v*` tag, only after the whole matrix passes,
# and the tag is validated against the version in Cargo.toml first. `contents:
# write` is granted to the release job alone; every other job is read-only, which
# keeps an untrusted pull request from obtaining a writable token.
#
# The `setup` job resolves PROJECT_TYPE into a job output. Every downstream job gates
# on that output rather than on `env`, because the `env` context is NOT available in a
# job-level `if:` expression. It also reports whether buildable source is present, so an
# unfilled template scaffold reports success instead of failing on an empty project.

name: CI and Release

# Read-only by default. The release job raises its own permission explicitly, so
# a pull-request build never holds a writable token.
permissions:
  contents: read

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

env:
  PROJECT_TYPE: rust
  BINARY_NAME: skill
  PYTHON_PACKAGE_NAME: skill
  DOCKER_IMAGE_NAME: skill
  MSRV: "1.88"

jobs:
  setup:
    name: Resolve project configuration
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.resolve.outputs.project_type }}
      has_source: ${{ steps.resolve.outputs.has_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve project type and source presence
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "project_type=${PROJECT_TYPE}" >> "$GITHUB_OUTPUT"

          has_source=false
          case "${PROJECT_TYPE}" in
            rust)
              if [ -f Cargo.toml ] && [ -d src ]; then
                has_source=true
              fi
              ;;
            python)
              if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
                has_source=true
              fi
              ;;
            *)
              echo "::error::PROJECT_TYPE must be 'rust' or 'python', got '${PROJECT_TYPE}'"
              exit 1
              ;;
          esac

          echo "has_source=${has_source}" >> "$GITHUB_OUTPUT"
          if [ "${has_source}" = "false" ]; then
            echo "::notice::No ${PROJECT_TYPE} source detected. This is an unfilled template scaffold, so build, test, and release jobs are skipped."
          fi

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.project_type == 'rust' && needs.setup.outputs.has_source == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: swatinem/rust-cache@v2
      - name: Check against the declared MSRV
        run: cargo check --locked --all-targets

  feature-matrix:
    name: Feature combinations
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.project_type == 'rust' && needs.setup.outputs.has_source == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      # The SMB backend must be genuinely optional, so the crate has to build and
      # test without it. These are checked separately rather than together,
      # because a combined build would not prove either configuration works.
      - name: No default features
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --locked --no-default-features
      - name: All features
        run: cargo test --locked --all-features

  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: setup
    if: needs.setup.outputs.has_source == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # RUST TOOLCHAIN + CI PATH
      - name: Set up Rust
        if: needs.setup.outputs.project_type == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: needs.setup.outputs.project_type == 'rust'
        uses: swatinem/rust-cache@v2

      - name: Rust Format (cargo fmt)
        if: needs.setup.outputs.project_type == 'rust'
        run: cargo fmt --all -- --check

      - name: Rust Lints (cargo clippy)
        if: needs.setup.outputs.project_type == 'rust'
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust Build (release)
        if: needs.setup.outputs.project_type == 'rust'
        run: cargo build --release

      - name: Rust Tests
        if: needs.setup.outputs.project_type == 'rust'
        run: cargo test --all --no-fail-fast

      # Uploaded on every successful build so a reviewer can try a PR binary.
      # The binary must be renamed to its final asset name HERE, not at release
      # time. The artifact name encodes the platform but the file inside does
      # not, so `download-artifact` with `merge-multiple` would collapse every
      # platform's `skill` into one file and the release glob would match
      # nothing. Renaming per job keeps the six assets distinct.
      - name: Stage the release asset
        if: needs.setup.outputs.project_type == 'rust'
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    ASSET="${BINARY_NAME}-linux-x64" ;;
            Linux-ARM64)  ASSET="${BINARY_NAME}-linux-aarch64" ;;
            macOS-X64)    ASSET="${BINARY_NAME}-macos-x64" ;;
            macOS-ARM64)  ASSET="${BINARY_NAME}-macos-aarch64" ;;
            Windows-X64)  ASSET="${BINARY_NAME}-windows-x64.exe" ;;
            Windows-ARM64) ASSET="${BINARY_NAME}-windows-aarch64.exe" ;;
            *) echo "::error::unmapped runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          SRC="target/release/${BINARY_NAME}"
          [ "${{ runner.os }}" = "Windows" ] && SRC="${SRC}.exe"
          mkdir -p staged
          cp "$SRC" "staged/$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload Rust binary artifact
        if: needs.setup.outputs.project_type == 'rust'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.asset }}
          path: staged/${{ steps.stage.outputs.asset }}
          if-no-files-found: error

      # PYTHON TOOLCHAIN + CI PATH
      - name: Set up Python
        if: needs.setup.outputs.project_type == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        if: needs.setup.outputs.project_type == 'python'
        shell: bash
        run: |
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Python Lint/Format (optional placeholder)
        if: needs.setup.outputs.project_type == 'python'
        shell: bash
        run: |
          echo "Add flake8/black/ruff/mypy here if desired"

      - name: Python Tests
        if: needs.setup.outputs.project_type == 'python'
        shell: bash
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      - name: Build Python package
        if: needs.setup.outputs.project_type == 'python' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pip install build
          python -m build

      - name: Upload Python package artifacts
        if: needs.setup.outputs.project_type == 'python' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PYTHON_PACKAGE_NAME }}-dist
          path: dist/*

  # RUST-ONLY CROSS BUILDS (aarch64)
  linux-arm64:
    name: Linux aarch64 (cross)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.project_type == 'rust' && needs.setup.outputs.has_source == 'true' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        run: cross build --release --target aarch64-unknown-linux-gnu
      - name: Stage and upload binary (linux-aarch64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp "target/aarch64-unknown-linux-gnu/release/${{ env.BINARY_NAME }}" "staged/${BINARY_NAME}-linux-aarch64"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-aarch64
          path: staged/${{ env.BINARY_NAME }}-linux-aarch64
          if-no-files-found: error

  macos-arm64:
    name: macOS aarch64 (native)
    runs-on: macos-latest
    needs: setup
    if: needs.setup.outputs.project_type == 'rust' && needs.setup.outputs.has_source == 'true' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build (macOS aarch64)
        run: cargo build --release --target aarch64-apple-darwin
      - name: Stage and upload binary (macos-aarch64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp "target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }}" "staged/${BINARY_NAME}-macos-aarch64"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-macos-aarch64
          path: staged/${{ env.BINARY_NAME }}-macos-aarch64
          if-no-files-found: error

  windows-arm64:
    name: Windows aarch64 (cross)
    runs-on: windows-latest
    needs: setup
    if: needs.setup.outputs.project_type == 'rust' && needs.setup.outputs.has_source == 'true' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build (windows aarch64)
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Stage and upload binary (windows-aarch64.exe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          cp "target/aarch64-pc-windows-msvc/release/${{ env.BINARY_NAME }}.exe" "staged/${BINARY_NAME}-windows-aarch64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-aarch64.exe
          path: staged/${{ env.BINARY_NAME }}-windows-aarch64.exe
          if-no-files-found: error

  release:
    name: Release on tag
    runs-on: ubuntu-latest
    needs:
      - setup
      - build-test
      - msrv
      - feature-matrix
      - linux-arm64
      - macos-arm64
      - windows-arm64
    # The aarch64 jobs are skipped for Python projects, and a skipped dependency would
    # otherwise skip this job too. always() keeps it reachable; the result checks make
    # sure a genuine failure still blocks the release.
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.setup.outputs.has_source == 'true' &&
      needs.build-test.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts (Rust + Python)
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true

      # An empty release is worse than no release, so this fails rather than
      # publishing nothing. The first v1.0.0 attempt published zero assets
      # because the downloaded files were all named `skill`, which is what the
      # per-job renaming above now prevents.
      - name: Create checksums (Rust binaries only)
        if: needs.setup.outputs.project_type == 'rust'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("${BINARY_NAME}"-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no release assets were downloaded; refusing to publish an empty release"
            ls -la
            exit 1
          fi
          for f in "${assets[@]}"; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
              echo "checksummed $f"
            fi
          done

      - name: Validate the tag against Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "tag $TAG matches Cargo.toml version $CARGO_VERSION"

      - name: Extract release notes
        id: extract_notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          NUMBER="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          : > release_notes.md
          # Accepts both "## v1.0.0" and the Keep a Changelog form "## [1.0.0] - DATE".
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$VERSION" -v num="$NUMBER" '
              /^## / {
                if (index($0, tag) > 0 || index($0, "[" num "]") > 0) { f = 1; next }
                else if (f) { f = 0 }
              }
              f && /^---[[:space:]]*$/ { f = 0 }
              f { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            git tag -l --format='%(contents)' "$VERSION" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            ${{ env.BINARY_NAME }}-*
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - setup
      - build-test
    if: needs.setup.outputs.has_source == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-arch Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${DOCKER_IMAGE_NAME}:latest" \
            --target final \
            .

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: final
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
