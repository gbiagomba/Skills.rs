[package]
name = "skill"
version = "1.2.0"
authors = ["Gilles Biagomba <gilles.infosec@gmail.com>"]
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A cross-agent skill manager with safe copying, linking, migration, updates, and synchronization."
repository = "https://github.com/gbiagomba/Skills.rs"
readme = "README.md"
keywords = ["cli", "agent", "skills", "claude", "copilot"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs", "/scripts", "/Skills", "/rules", "/tests/fixtures"]

[[bin]]
name = "skill"
path = "src/main.rs"

[lib]
name = "skill"
path = "src/lib.rs"

[profile.release]
strip = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fs4 = "1.1.0"
hex = "0.4.3"
inquire = "0.9.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.6"
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.151"
